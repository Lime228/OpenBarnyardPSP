name: PSP

on:
  push:
    branches:
      - psp-port
  pull_request:
    paths:
      - '.github/workflows/psp.yaml'
      - 'premake5.lua'
      - 'Settings.lua'
      - 'Ports/PSP/**'
      - 'Tools/TMDL/**'
      - 'Toshi/**'
  workflow_dispatch:

jobs:
  host-tools:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Premake
        uses: abel0b/setup-premake@v2.3
        with:
          version: "5.0.0"

      - name: Generate host tools project
        run: premake5 vs2022 --arch=x86 --renderer=DX8

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build PSP asset host tools
        run: >-
          msbuild Tools/TMDL/TMDL.vcxproj
          /m
          /p:Configuration=Release
          /p:Platform=Win32

      - name: Publish PSP asset host tools
        uses: actions/upload-artifact@v4
        with:
          name: OpenBarnyard-PSP-host-tools
          path: |
            bin/Release_Win32_x86_DX8/TMDL/TMDL.exe
            bin/Release_Win32_x86_DX8/TMDL/assimp-vc143-mt.dll
          if-no-files-found: error

  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Premake
        uses: abel0b/setup-premake@v2.3
        with:
          version: "5.0.0"

      - name: Verify converted PSP assets
        run: |
          python3 Ports/PSP/Tools/convert_texture.py Ports/PSP/Assets/probe.ppm /tmp/probe.ptex
          python3 Ports/PSP/Tools/convert_mesh.py Ports/PSP/Assets/probe.obj /tmp/probe.pmes
          python3 Ports/PSP/Tools/convert_mesh.py Ports/PSP/Assets/probe.obj /tmp/probe_skinned.pmes --skeleton Ports/PSP/Assets/probe_skeleton.json --weights Ports/PSP/Assets/probe_weights.json
          python3 Ports/PSP/Tools/convert_skeleton.py Ports/PSP/Assets/probe_skeleton.json /tmp/probe.pskl
          python3 Ports/PSP/Tools/convert_animation.py Ports/PSP/Assets/probe_skeleton.json Ports/PSP/Assets/probe_animation.json /tmp/probe.panm
          python3 Ports/PSP/Tools/convert_tmd_dump.py Ports/PSP/Assets/probe_tmd_dump.json /tmp/probe_tmd_bridge.pmes /tmp/probe_tmd_bridge.pskl
          python3 Ports/PSP/Tools/test_convert_tmd_dump.py
          python3 Ports/PSP/Tools/test_convert_barnyard_skin.py
          python3 Ports/PSP/Tools/convert_world.py Ports/PSP/Assets/probe_world.json /tmp/probe.pwld
          python3 Ports/PSP/Tools/test_convert_world.py
          python3 Ports/PSP/Tools/generate_bootstrap_font.py Ports/PSP/Assets/bootstrap_font.ppm Ports/PSP/Assets/bootstrap_font.pfnt
          python3 Ports/PSP/Tools/convert_texture.py --alpha-mask Ports/PSP/Assets/bootstrap_font.ppm Ports/PSP/Assets/bootstrap_font.ptex
          python3 Ports/PSP/Tools/generate_bootstrap_locale.py Ports/PSP/Assets/bootstrap_locale.ploc
          python3 Ports/PSP/Tools/generate_bootstrap_audio.py Ports/PSP/Assets/bootstrap_audio.ppcm
          python3 Ports/PSP/Tools/generate_bootstrap_audio.py /tmp/ui_menuclick.ppcm --sample-frames 256 --amplitude 9000 --half-period-frames 8
          python3 Ports/PSP/Tools/generate_bootstrap_audio.py /tmp/ui_menuback.ppcm --sample-frames 384 --amplitude 7000 --half-period-frames 16
          python3 Ports/PSP/Tools/generate_bootstrap_audio.py /tmp/ui_menuok.ppcm --sample-frames 512 --amplitude 8000 --half-period-frames 32
          python3 Ports/PSP/Tools/generate_bootstrap_audio.py /tmp/ui_menuclick.wav --format wav --sample-frames 256 --amplitude 9000 --half-period-frames 8
          python3 Ports/PSP/Tools/convert_audio.py /tmp/ui_menuclick.wav /tmp/ui_menuclick_converted.ppcm --format ppcm
          python3 Ports/PSP/Tools/generate_bootstrap_audio.py /tmp/bootstrap_stream.ppcm --sample-frames 3072
          python3 Ports/PSP/Tools/generate_bootstrap_adpcm.py /tmp/bootstrap_stream_generated.padp --sample-frames 3072 --loop-start 1024 --loop-end 3072
          python3 Ports/PSP/Tools/convert_audio.py Ports/PSP/Assets/bootstrap_stream.wav /tmp/bootstrap_stream.padp --loop-start 1024 --loop-end 3072
          python3 Ports/PSP/Tools/generate_wave_bank.py /tmp/bootstrap_audio.pbnk --wave bootstrap=local:bootstrap_audio.ppcm --wave ui_menuclick=local:ui_menuclick.ppcm --wave ui_menuback=local:ui_menuback.ppcm --wave ui_menuok=local:ui_menuok.ppcm --stream bootstrap_stream=local:bootstrap_stream.padp
          cmp Ports/PSP/Assets/probe.ptex /tmp/probe.ptex
          cmp Ports/PSP/Assets/probe.pmes /tmp/probe.pmes
          cmp Ports/PSP/Assets/probe_skinned.pmes /tmp/probe_skinned.pmes
          cmp Ports/PSP/Assets/probe.pskl /tmp/probe.pskl
          cmp Ports/PSP/Assets/probe.panm /tmp/probe.panm
          cmp Ports/PSP/Assets/probe_tmd_bridge.pmes /tmp/probe_tmd_bridge.pmes
          cmp Ports/PSP/Assets/probe_tmd_bridge.pskl /tmp/probe_tmd_bridge.pskl
          cmp Ports/PSP/Assets/bootstrap_audio.pbnk /tmp/bootstrap_audio.pbnk
          cmp Ports/PSP/Assets/ui_menuclick.ppcm /tmp/ui_menuclick.ppcm
          cmp Ports/PSP/Assets/ui_menuclick.ppcm /tmp/ui_menuclick_converted.ppcm
          cmp Ports/PSP/Assets/ui_menuback.ppcm /tmp/ui_menuback.ppcm
          cmp Ports/PSP/Assets/ui_menuok.ppcm /tmp/ui_menuok.ppcm
          cmp Ports/PSP/Assets/bootstrap_stream.ppcm /tmp/bootstrap_stream.ppcm
          cmp Ports/PSP/Assets/bootstrap_stream.padp /tmp/bootstrap_stream.padp
          cmp Ports/PSP/Assets/bootstrap_stream.padp /tmp/bootstrap_stream_generated.padp

      - name: Generate PSP project
        env:
          PSPDEV: /usr/local/pspdev
        run: |
          chmod +x .premake/premake5
          premake5 gmake --target=psp

      - name: Build PSP bootstrap
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/workspace"
          --workdir /workspace
          ghcr.io/pspdev/pspdev:latest
          make -C Build/PSP config=release_psp -j"$(nproc)"

      - name: Publish PSP bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: OpenBarnyard-PSP-bootstrap
          path: |
            bin/PSP/Release/EBOOT.PBP
            bin/PSP/Release/probe.ptex
            bin/PSP/Release/probe.pmes
            bin/PSP/Release/probe_skinned.pmes
            bin/PSP/Release/probe.pskl
            bin/PSP/Release/probe.panm
            bin/PSP/Release/bootstrap_font.ptex
            bin/PSP/Release/bootstrap_font.pfnt
            bin/PSP/Release/bootstrap_locale.ploc
            bin/PSP/Release/bootstrap_audio.ppcm
            bin/PSP/Release/bootstrap_audio.pbnk
            bin/PSP/Release/ui_menuclick.ppcm
            bin/PSP/Release/ui_menuback.ppcm
            bin/PSP/Release/ui_menuok.ppcm
            bin/PSP/Release/bootstrap_stream.ppcm
            bin/PSP/Release/bootstrap_stream.padp
          if-no-files-found: error
