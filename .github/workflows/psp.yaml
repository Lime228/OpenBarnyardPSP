name: PSP

on:
  push:
    branches:
      - psp-port
  pull_request:
    paths:
      - '.github/workflows/psp.yaml'
      - 'premake5.lua'
      - 'Settings.lua'
      - 'Ports/PSP/**'
      - 'Toshi/**'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Premake
        uses: abel0b/setup-premake@v2.3
        with:
          version: "5.0.0"

      - name: Generate PSP project
        run: |
          chmod +x .premake/premake5
          premake5 gmake2 --target=psp

      - name: Build PSP bootstrap
        run: make -C Build/PSP config=release_psp -j$(nproc)

      - name: Publish PSP bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: OpenBarnyard-PSP-bootstrap
          path: bin/PSP/Release/EBOOT.PBP
          if-no-files-found: error
