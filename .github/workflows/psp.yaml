name: PSP

on:
  push:
    branches:
      - psp-port
  pull_request:
    paths:
      - '.github/workflows/psp.yaml'
      - 'premake5.lua'
      - 'Settings.lua'
      - 'Ports/PSP/**'
      - 'Toshi/**'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Premake
        uses: abel0b/setup-premake@v2.3
        with:
          version: "5.0.0"

      - name: Verify converted PSP assets
        run: |
          python3 Ports/PSP/Tools/convert_texture.py Ports/PSP/Assets/probe.ppm /tmp/probe.ptex
          python3 Ports/PSP/Tools/convert_mesh.py Ports/PSP/Assets/probe.obj /tmp/probe.pmes
          python3 Ports/PSP/Tools/generate_bootstrap_font.py Ports/PSP/Assets/bootstrap_font.ppm Ports/PSP/Assets/bootstrap_font.pfnt
          python3 Ports/PSP/Tools/convert_texture.py --alpha-mask Ports/PSP/Assets/bootstrap_font.ppm Ports/PSP/Assets/bootstrap_font.ptex
          cmp Ports/PSP/Assets/probe.ptex /tmp/probe.ptex
          cmp Ports/PSP/Assets/probe.pmes /tmp/probe.pmes

      - name: Generate PSP project
        env:
          PSPDEV: /usr/local/pspdev
        run: |
          chmod +x .premake/premake5
          premake5 gmake --target=psp

      - name: Build PSP bootstrap
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/workspace"
          --workdir /workspace
          ghcr.io/pspdev/pspdev:latest
          make -C Build/PSP config=release_psp -j"$(nproc)"

      - name: Publish PSP bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: OpenBarnyard-PSP-bootstrap
          path: |
            bin/PSP/Release/EBOOT.PBP
            bin/PSP/Release/probe.ptex
            bin/PSP/Release/probe.pmes
            bin/PSP/Release/bootstrap_font.ptex
            bin/PSP/Release/bootstrap_font.pfnt
          if-no-files-found: error
